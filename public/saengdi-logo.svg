<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Arrow Left Facet Gradient: Deep Cobalt to Vivid Azure -->
    <linearGradient id="saengdiArrowLeftFacet" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#004AD7" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Arrow Right Facet Gradient: Lighter Azure to Bright Turquoise -->
    <linearGradient id="saengdiArrowRightFacet" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#006EFF" />
      <stop offset="50%" stop-color="#00A2FF" />
      <stop offset="100%" stop-color="#00D7D0" />
    </linearGradient>

    <!-- Arrowhead Gradient: Turquoise to Vivid Neon Mint/Lime -->
    <linearGradient id="saengdiArrowHead" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#00C4D6" />
      <stop offset="40%" stop-color="#00D8C0" />
      <stop offset="75%" stop-color="#02EE9E" />
      <stop offset="100%" stop-color="#34FCA4" />
    </linearGradient>

    <!-- '디' Vowel Upper Accent Pill: Emerald to Neon Mint -->
    <linearGradient id="saengdiMintPill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B876" />
      <stop offset="50%" stop-color="#02E08A" />
      <stop offset="100%" stop-color="#3EF8A6" />
    </linearGradient>
  </defs>

  <!-- ==================== Left Brand Mark: '생디' ==================== -->
  <g id="saengdi-mark">
    <!-- ===== '생' ===== -->
    <!-- 'ㅅ' Left Diagonal Bar (Solid Navy, 45° angle, rounded caps) -->
    <path d="M 75 245 L 165 155" stroke="#08326E" stroke-width="44" stroke-linecap="round" />

    <!-- 'ㅅ' Right 3D Ribbon Arrow Shaft (Dual Facet Fold) -->
    <!-- Left Facet of Arrow Shaft -->
    <path d="M 148 217 L 221 144 L 235 158 L 162 231 Z" fill="url(#saengdiArrowLeftFacet)" />
    <!-- Right Facet of Arrow Shaft -->
    <path d="M 162 231 L 235 158 L 249 144 L 176 217 Z" fill="url(#saengdiArrowRightFacet)" />
    <!-- Bottom Rounded Base of Shaft -->
    <path d="M 148 217 C 141 224 141 236 148 243 C 155 250 167 250 174 243 L 176 241 L 148 217 Z" fill="#004AD7" />

    <!-- Symmetrical Arrowhead (Tip at 318, 47 | Left wing at 237, 57 | Right wing at 308, 128) -->
    <path d="M 318 47 L 237 57 L 258 78 L 287 107 L 308 128 Z" 
          fill="url(#saengdiArrowHead)" 
          stroke-linejoin="round" />

    <!-- Middle Horizontal Capsule of '생' -->
    <rect x="172" y="104" width="56" height="32" rx="16" fill="#08326E" />

    <!-- Right Vertical Capsule of '생' -->
    <rect x="236" y="110" width="32" height="68" rx="16" fill="#08326E" />

    <!-- Bottom Hollow Ring 'ㅇ' of '생' (Center 196, 246, radius 46, thickness 36) -->
    <circle cx="196" cy="246" r="46" fill="none" stroke="#08326E" stroke-width="36" />

    <!-- ===== '디' ===== -->
    <!-- Consonant 'ㄷ' with organic smooth curves -->
    <path d="M 455 76 L 395 76 C 365 76 350 91 350 121 L 350 199 C 350 229 365 244 395 244 L 455 244" 
          fill="none" stroke="#08326E" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Vowel 'ㅣ' Upper Accent (45° diagonal neon mint pill) -->
    <path d="M 485 115 L 530 70" stroke="url(#saengdiMintPill)" stroke-width="36" stroke-linecap="round" />

    <!-- Vowel 'ㅣ' Lower Main Vertical Stem (rounded capsule) -->
    <rect x="494" y="124" width="38" height="146" rx="19" fill="#08326E" />
  </g>

  <!-- ==================== Right Brand Typography ==================== -->
  <g id="saengdi-typography">
    <!-- Main Slogan: "학생부를 디자인하다" -->
    <text x="585" y="165" 
          font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" 
          font-size="76" 
          font-weight="900" 
          letter-spacing="-0.035em" 
          fill="#082855">학생부를 디자인하다</text>

    <!-- Subtitle: "A I   기 반   학 생 부   디 자 인   플 랫 폼" -->
    <text x="590" y="242" 
          font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="0.23em" 
          fill="#36537A">A I   기 반   학 생 부   디 자 인   플 랫 폼</text>
  </g>
</svg>
